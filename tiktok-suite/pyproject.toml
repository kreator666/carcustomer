[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttkitc"
version = "0.1.0"
description = "TikTok 获客套件：评论采集 / 线索评分 / 回复·关注·私信自动化 + FastAPI 服务"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "websocket-client",
    "requests",
]

[project.scripts]
ttkitc = "ttkitc.cli:main"

[tool.setuptools]
packages = ["ttkitc"]

[tool.setuptools.package-data]
ttkitc = ["schema.sql"]
